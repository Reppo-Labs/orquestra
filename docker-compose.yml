# Orquestra node — one-command run for operators (see ADR 0001).
#   cp .env.example .env   # paste your wallet key + LLM key
#   docker compose up -d
# Then reach the dashboard over an SSH tunnel and onboard (see README / ADR 0002):
#   ssh -L 7070:localhost:7070 <your-host>   →   http://localhost:7070
services:
  orquestra:
    image: ghcr.io/reppo-labs/orquestra:latest   # pin a version (e.g. :0.1.0) in production
    # Fallback: if the image can't be pulled (e.g. registry hiccup), compose builds it
    # from this repo's Dockerfile instead — `docker compose up -d --build` forces it.
    build: .
    container_name: orquestra
    env_file: .env
    # The image defaults the dashboard bind to 127.0.0.1; inside this bridge-networked
    # container the host mapping below forwards to the container's bridge IP, so the
    # server must bind all interfaces to be reachable. Set here (overrides .env) so the
    # 0.0.0.0 bind lives right next to the 127.0.0.1 host mapping that is the real
    # exposure boundary (ADR 0002).
    environment:
      - DASHBOARD_HOST=0.0.0.0
      # Pin the data dir to the mounted volume below. The image already defaults this, but
      # setting it here guarantees the strategy config + ledgers + activity DB always land on
      # the named volume — never the container's writable layer (which `compose down && up`
      # discards, the cause of "onboarding lost after down/up but kept on restart").
      - ORQUESTRA_DATA_DIR=/data
    # Localhost-only by design: the dashboard is unauthenticated (ADR 0002).
    # Do NOT change the mapping below to 0.0.0.0 without adding a dashboard secret first.
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - orquestra-data:/data
    restart: unless-stopped

  # Parallel Robinhood Chain node — OPT-IN via profile, so a plain
  # `docker compose up -d` (Base-only operators) is unaffected:
  #   cp .env.robinhood.example .env.robinhood   # wallet + LLM key + robinhood RPC
  #   docker compose --profile robinhood up -d
  # Dashboard: ssh -L 7071:localhost:7071 <host> → http://localhost:7071
  # Same wallet key as the Base node is fine (different chains, independent nonces).
  # State is fully separate on purpose: budget ledger, activity DB, and strategy
  # config must never be shared across networks (datanet ids collide; robinhood
  # fees are in per-datanet tokens, not REPPO).
  orquestra-robinhood:
    image: ghcr.io/reppo-labs/orquestra:latest
    build: .
    container_name: orquestra-robinhood
    profiles: [robinhood]
    env_file: .env.robinhood
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - ORQUESTRA_DATA_DIR=/data
      # The network is this service's identity — pinned here (overrides the env
      # file) so a copy-pasted .env can never silently run this node on Base.
      - REPPO_NETWORK=robinhood
    ports:
      - "127.0.0.1:7071:7070"
    volumes:
      - orquestra-robinhood-data:/data
    restart: unless-stopped

volumes:
  orquestra-data:
  orquestra-robinhood-data:
