# Local override for Ana's Base node: it predates the named-volume compose setup
# and keeps its state in ./orquestra-data (bind mount). Same /data target, so this
# entry replaces the named volume from docker-compose.yml at merge time.
# (The robinhood node is untouched — it already uses its named volume.)
services:
  orquestra:
    volumes:
      - ./orquestra-data:/data
    # Locally-built image carrying the hyperliquid 429 partial-result fix, the
    # sherwood tool->json schema fallback, and the GDELT cooldown. Revert both
    # `image:` lines to fall back to ghcr.io/reppo-labs/orquestra:latest.
    image: orquestra:profitability-fix

  orquestra-robinhood:
    image: orquestra:profitability-fix
